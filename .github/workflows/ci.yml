name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev extras)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Unit tests (offline — no agy, no quota)
        run: >-
          pytest test_server.py test_swarm.py test_codex.py test_copilot.py
          test_cursor.py test_grok.py test_kimi.py test_opencode.py
          test_proc_tree.py test_muse.py test_presets.py -q

  package:
    name: wheel installs and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python -m pip install --upgrade build && python -m build --wheel

      # The unit tests import from the repo root, so they cannot see what the
      # wheel leaves out — 0.30.1 shipped without proc_tree.py and could not
      # start. Install the wheel into a clean venv and import it from outside
      # the checkout, which is exactly what `uvx agent-intern` does.
      - name: Import the server from a clean install
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import server; print('agent-intern', server.__version__, 'imports cleanly')"
