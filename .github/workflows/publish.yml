name: Publish to PyPI

# Fires on every version tag (release.yml drafts the GitHub Release notes from
# the same tag, in parallel). Builds the sdist + wheel and uploads to PyPI via
# Trusted Publishing — no stored token: configure the trusted publisher once at
# https://pypi.org/manage/project/agent-intern/settings/publishing/
#   Owner: SinanTufekci  Repo: agent-intern
#   Workflow: publish.yml  Environment: pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-intern
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify version tag matches pyproject
        run: |
          PKG=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject=$PKG  tag=$TAG"
          test "$PKG" = "$TAG" || { echo "::error::tag $TAG != pyproject version $PKG"; exit 1; }

      # Last gate before an upload that can't be taken back: install the wheel
      # into a clean venv and import it from outside the checkout. 0.30.1 went
      # out missing a module and could not start; this is the check that would
      # have stopped it (ci.yml runs the same one on every push).
      - name: Import the server from a clean install
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import server; print('agent-intern', server.__version__, 'imports cleanly')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # List the release in the official MCP Registry (registry.modelcontextprotocol.io),
  # which MCP clients and directories read from. It verifies we own the PyPI package
  # by finding the `mcp-name:` line in the README PyPI just published, so it must run
  # after the upload. Auth is GitHub OIDC — no stored token — and it grants only the
  # io.github.SinanTufekci/* namespace.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      # PyPI's JSON API can lag the upload by a little, and the registry reads it to
      # verify ownership, so give it a few tries before calling the release broken.
      - name: Publish to the MCP Registry
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1
