name: Bug report
description: Something in the bridge isn't behaving the way the README says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file an issue. The CLIs behind this bridge
        update themselves, so a lot of breakage is "the CLI changed", not a bug
        in the bridge. Please fill out the backend, version and OS info so I can
        tell quickly which it is. Pasting the output of `uvx agent-intern doctor`
        (add `--verbose` for every check; it spends no quota) usually settles it
        in one go.

  - type: dropdown
    id: backend
    attributes:
      label: Which backend
      options:
        - Antigravity (agy)
        - Codex
        - Copilot
        - Cursor
        - opencode
        - Grok Build (experimental)
        - Kimi Code (experimental)
        - Muse Code (experimental)
        - More than one / swarm
        - Not backend-specific
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: CLI version
      description: Output of the backend's `--version` (`agy --version`, `codex --version`, ...).
      placeholder: "agy 1.5.3"
    validations:
      required: true

  - type: input
    id: bridge-version
    attributes:
      label: Bridge version
      description: "`uvx agent-intern --version`, or the `bridge version` row of any `*_status` tool."
      placeholder: "0.34.0"
    validations:
      required: true

  - type: textarea
    id: status-output
    attributes:
      label: Doctor output
      description: |
        Paste the output of `uvx agent-intern doctor --verbose`. It lists the bridge version, which
        backends are on, and every check, and spends no quota. Your home directory shows as `~`,
        e-mail addresses as `<email>` and API keys with a known prefix as `<key>`; still read it
        before you post. No terminal handy? Paste the backend's
        `*_status` tool output instead (`antigravity_status`, `codex_status`, ...).
      render: text
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      description: e.g. "Windows 11 26200", "macOS 14.5", "Ubuntu 24.04".
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.12.4"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, what did you expect, what did you get?
      placeholder: |
        I called `antigravity_ask("...")` from Claude Code and got ... instead of ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / transcript snippet
      description: |
        If the bridge raised an error, paste the traceback. If `agy` succeeded
        but returned the wrong text, paste the relevant lines from
        `~/.gemini/antigravity-cli/brain/<conv-id>/.system_generated/logs/transcript.jsonl`.
      render: text
    validations:
      required: false
