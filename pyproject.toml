[project]
name = "agent-intern"
version = "0.30.0"
description = "MCP server bridging the Antigravity (agy), OpenAI Codex, GitHub Copilot, Cursor, opencode, Grok Build, and Kimi Code CLIs so Claude Code can drive them as sub-agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sinan Tüfekçi" }]
keywords = ["mcp", "claude", "claude-code", "antigravity", "gemini", "agy", "codex", "copilot", "github-copilot", "cursor", "cursor-agent", "grok", "grok-build", "xai", "kimi", "kimi-code", "moonshot", "opencode", "sst", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    # Upper bound is deliberate: fastmcp 4 targets the 2026-07-28 MCP spec and drops
    # the 3.x compatibility shims. CI installs unpinned (`pip install -e .[dev]`), so
    # without a cap the first stable 4.0 silently becomes what every fresh install
    # gets. Lift to <5 once the server is verified against 4.0 stable.
    "fastmcp>=2.0.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# tools/capture_watch_gif.py only — records the README watch GIFs. Deliberately
# not in `dev`: it pulls Playwright, whose `playwright install chromium` step is a
# browser download nobody running the test suite needs. Unversioned on purpose —
# the script touches only long-stable PIL.Image / sync_playwright APIs, so a floor
# here would be an invented claim rather than a tested one.
assets = [
    "pillow",
    "playwright",
]

[project.scripts]
agent-intern = "server:main"

[project.urls]
Homepage = "https://github.com/SinanTufekci/agent-intern"
Repository = "https://github.com/SinanTufekci/agent-intern"
Issues = "https://github.com/SinanTufekci/agent-intern/issues"
Sponsor = "https://github.com/sponsors/SinanTufekci"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat layout: the distributable is the server module plus its swarm + codex +
# copilot helpers. Without this, setuptools auto-discovery aborts because the repo
# root also holds test_*.py.
[tool.setuptools]
py-modules = [
    "server",
    "swarm",
    "swarm_watch",
    "codex_bridge",
    "copilot_bridge",
    "cursor_bridge",
    "grok_bridge",
    "kimi_bridge",
    "opencode_bridge",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# swarm_watch.py is mostly one embedded HTML/CSS/JS page; its long style/script
# lines are an asset, not code to hard-wrap.
"swarm_watch.py" = ["E501"]
