<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">agent-intern: sub-agents on the plans you already pay for</title>
  <desc id="d">The agent-intern name and tagline. A box labelled your host, showing a prompt, sends work along lines to five coding CLIs: Gemini, Codex, Copilot, Cursor and opencode. Install with uvx agent-intern. Works in Claude Code, Antigravity CLI, Copilot CLI, Cursor CLI and opencode. An independent project, not affiliated with or endorsed by Anthropic, Google, OpenAI, GitHub, Cursor or the opencode project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a17"/><stop offset="0.55" stop-color="#0a1230"/><stop offset="1" stop-color="#0f1a44"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#22305a" opacity="0.55"/></pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="40%" stop-color="#060a17" stop-opacity="0"/><stop offset="100%" stop-color="#060a17" stop-opacity="0.85"/></radialGradient>
    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5b8cff" stop-opacity="0.28"/><stop offset="60%" stop-color="#5b8cff" stop-opacity="0.07"/><stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; }
  </style>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#vig)"/>

  <!-- header -->
  <text x="60" y="68" font-size="22" font-weight="600" letter-spacing="4" fill="#7f90c4">OPEN SOURCE · MCP SERVER</text>
  <text x="56" y="172" font-size="116" font-weight="800" fill="#f2f5ff" letter-spacing="-2">agent-intern</text>
  <text x="60" y="244" font-size="44" font-weight="500" fill="#c7d2f5">Sub-agents on the plans you already pay for</text>

  <!-- host -> five backend chips -->
  <ellipse cx="150" cy="345" rx="150" ry="120" fill="url(#hub-glow)"/>
  <g fill="none" stroke="#5b8cff" stroke-width="2" stroke-linecap="round">
    <path d="M250 345 H330" opacity="0.9"/>
    <path d="M330 302 V388" opacity="0.9"/>
    <path d="M330 302 H400 M330 388 H400" opacity="0.9"/>
    <path d="M650 302 H685 M935 302 H970 M792 388 H827" opacity="0.55" stroke-dasharray="3 7"/>
  </g>
  <circle cx="330" cy="345" r="5" fill="#5b8cff"/>
  <circle cx="394" cy="302" r="5" fill="#5b8cff"/>
  <circle cx="394" cy="388" r="5" fill="#5b8cff"/>

  <rect x="60" y="275" width="190" height="140" rx="22" fill="#0d1636" stroke="#5b8cff" stroke-width="2.5"/>
  <text class="mono" x="155" y="352" font-size="50" font-weight="700" fill="#8fb0ff" text-anchor="middle">&gt;_</text>
  <text x="155" y="394" font-size="22" font-weight="600" fill="#9fb0e0" text-anchor="middle">your host</text>

  <g font-size="30" font-weight="600" fill="#e8edff" text-anchor="middle">
    <rect x="400" y="270" width="250" height="64" rx="16" fill="#101b45" stroke="#33478c" stroke-width="2"/>
    <text x="525" y="312">Gemini</text>
    <rect x="685" y="270" width="250" height="64" rx="16" fill="#101b45" stroke="#33478c" stroke-width="2"/>
    <text x="810" y="312">Codex</text>
    <rect x="970" y="270" width="250" height="64" rx="16" fill="#101b45" stroke="#33478c" stroke-width="2"/>
    <text x="1095" y="312">Copilot</text>
    <rect x="400" y="356" width="392" height="64" rx="16" fill="#101b45" stroke="#33478c" stroke-width="2"/>
    <text x="596" y="398">Cursor</text>
    <rect x="827" y="356" width="393" height="64" rx="16" fill="#101b45" stroke="#33478c" stroke-width="2"/>
    <text x="1023.5" y="398">opencode</text>
  </g>

  <!-- footer block -->
  <text x="60" y="470" font-size="30" fill="#8d9bc8">images · second opinions · swarms · panels</text>
  <rect x="60" y="488" width="372" height="54" rx="14" fill="#0b1230" stroke="#5b8cff" stroke-width="2"/>
  <text class="mono" x="246" y="526" font-size="34" font-weight="700" fill="#cfe0ff" text-anchor="middle">uvx agent-intern</text>
  <text x="60" y="582" font-size="24" fill="#8d9bc8">Works in Claude Code · Antigravity CLI · Copilot CLI · Cursor CLI · opencode</text>
  <text x="60" y="616" font-size="17" fill="#6f7fb0">Independent project. Not affiliated with or endorsed by Anthropic, Google, OpenAI, GitHub, Cursor or the opencode project.</text>
</svg>
